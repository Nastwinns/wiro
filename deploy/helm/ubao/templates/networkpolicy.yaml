{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ubao.fullname" . }}
  labels: {{- include "ubao.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ubao.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- end }}
    - to:
        - podSelector: {}
      ports:
        - { port: 5432, protocol: TCP }
    {{- with .Values.networkPolicy.egress.postgresCIDR }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ port: 5432, protocol: TCP }]
    {{- end }}
    {{- with .Values.networkPolicy.egress.s3CIDR }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ port: 443, protocol: TCP }, { port: 9000, protocol: TCP }]
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
